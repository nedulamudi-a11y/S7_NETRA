<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Activity Portal">
    <title>Student Activity Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Student Activity Portal</h1>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#events">Events</a>
    <a href="#register">Register</a>
</nav>

<main id="home">

<section id="events">
    <h2>Upcoming Events</h2>
    <article>
        <h3>Technical Fest</h3>
        <p>Coding competitions.</p>
    </article>
    <article>
        <h3>Sports Meet</h3>
        <p>Sports activities.</p>
    </article>
</section>

<aside>
    <h3>Notice Board</h3>
    <p>Registration is open.</p>
</aside>

<section id="register">
    <h2>Registration Form</h2>

    <form id="form">
        <label for="name">Name:</label>
        <input type="text" id="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <label for="dept">Department:</label>
        <select id="dept" required>
            <option value="">Select</option>
            <option>CSE</option>
            <option>ECE</option>
        </select>

        <p>Mode:</p>
        <input type="radio" name="mode" id="online" required>
        <label for="online">Online</label>
        <input type="radio" name="mode" id="offline">
        <label for="offline">Offline</label>

        <p>Activities:</p>
        <input type="checkbox" id="coding">
        <label for="coding">Coding</label>
        <input type="checkbox" id="sports">
        <label for="sports">Sports</label>

        <label for="msg">Message:</label>
        <textarea id="msg"></textarea>

        <button type="submit">Register</button>
        <p id="result" role="status" aria-live="polite"></p>
    </form>
</section>

</main>

<footer>
    <p>© 2026 Student Activity Portal</p>
</footer>

<script src="script.js"></script>
</body>
</html>
